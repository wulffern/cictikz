# cictikz symbol metadata. Coordinates are figure units (\grid = 1.6),
# relative to the macro entry point, y up, taken from the macro body in
# cictikz_lib.tex. Transistor gate pins are at the END of the gate lead
# (the circuitikz .gate anchor, measured); in TikZ prefer the node
# anchor (e.g. M1.gate) over the raw coordinate.
name: cicOtaSWP
macro: \cicOtaSWP
nargs: 4
arg_doc:
- +in label
- -in label
- +out label
- -out label
description: Fully differential OTA outline with caller-set port labels (+in/-in/+out/-out)
entry:
- 0
- 0
exit:
- 0
- 0
height_grid: 0
width_grid: 0
pins:
- name: inp
  grid_xy:
  - 0
  - 0
  direction: in
- name: inn
  grid_xy:
  - 0
  - -1.6
  direction: in
- name: outp
  grid_xy:
  - 2.6
  - -1.6
  direction: out
- name: outn
  grid_xy:
  - 2.6
  - 0
  direction: out
exports:
  cicOta_inp:
  - 0
  - 0
  cicOta_inn:
  - 0
  - -1.6
  cicOta_outp:
  - 2.6
  - -1.6
  cicOta_outn:
  - 2.6
  - 0
example: \draw (0,0) \cicOtaSWP{x}{x}{x}{x};
