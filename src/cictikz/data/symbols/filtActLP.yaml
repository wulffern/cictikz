# cictikz symbol metadata. Coordinates are figure units (\grid = 1.6),
# relative to the macro entry point, y up, taken from the macro body in
# cictikz_lib.tex. Transistor gate pins are at the END of the gate lead
# (the circuitikz .gate anchor, measured); in TikZ prefer the node
# anchor (e.g. M1.gate) over the raw coordinate.
name: filtActLP
macro: \filtActLP
nargs: 2
arg_doc:
- R label
- C label
description: 'Active RC low-pass: R into OTA virtual ground, C in feedback'
entry:
- 0
- 0
exit:
- 4.2
- 0
height_grid: 0
width_grid: 0
pins:
- name: in
  grid_xy:
  - 0
  - 0
  direction: in
- name: out
  grid_xy:
  - 4.2
  - 0
  direction: out
exports:
  cicStart:
  - 0
  - 0
  resEnd:
  - 1.6
  - 0
  capEnd:
  - 3.7
  - 1
  cStart:
  - 1.6
  - -1.7
  cicOta_inp:
  - 1.6
  - 0
  cicOta_inn:
  - 1.6
  - -1.6
  cicOta_outp:
  - 4.2
  - -1.6
  cicOta_outn:
  - 4.2
  - 0
example: \draw (0,0) \filtActLP{x}{x};
