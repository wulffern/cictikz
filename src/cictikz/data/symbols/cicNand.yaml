# cictikz symbol metadata. Coordinates are figure units (\grid = 1.6),
# relative to the macro entry point, y up, taken from the macro body in
# cictikz_lib.tex. Transistor gate pins are at the END of the gate lead
# (the circuitikz .gate anchor, measured); in TikZ prefer the node
# anchor (e.g. M1.gate) over the raw coordinate.
name: cicNand
macro: \cicNand
nargs: 1
arg_doc:
- instance name, e.g. g1
description: NAND gate, hand-rolled house shape; exports <n>_in1/_in2/_out
entry:
- 0
- 0
exit:
- 1.38
- 0
height_grid: 0
width_grid: 0
pins:
- name: in1
  grid_xy:
  - 0
  - 0.32
  direction: in
- name: in2
  grid_xy:
  - 0
  - -0.32
  direction: in
- name: out
  grid_xy:
  - 1.38
  - 0
  direction: out
exports: {}
example: '\draw (0,0) \cicNand{g1};

  \draw (-0.5,0.32) -- (g1_in1);'
