# cictikz symbol metadata. Coordinates are figure units (\grid = 1.6),
# relative to the macro entry point, y up, taken from the macro body in
# cictikz_lib.tex. Transistor gate pins are at the END of the gate lead
# (the circuitikz .gate anchor, measured); in TikZ prefer the node
# anchor (e.g. M1.gate) over the raw coordinate.
name: cicTgate
macro: \cicTgate
nargs: 1
arg_doc:
- instance name
description: 'Transmission gate: facing triangles, enable below, enable-bar bubble
  above'
entry:
- 0
- 0
exit:
- 1.4
- 0
height_grid: 0
width_grid: 0
pins:
- name: in
  grid_xy:
  - 0
  - 0
  direction: in
- name: out
  grid_xy:
  - 1.4
  - 0
  direction: out
- name: en
  grid_xy:
  - 0.7
  - -0.55
  direction: in
- name: enb
  grid_xy:
  - 0.7
  - 0.64
  direction: in
exports: {}
example: \draw (0,0) \cicTgate{x};
