# cictikz symbol metadata. Coordinates are figure units (\grid = 1.6),
# relative to the macro entry point, y up, taken from the macro body in
# cictikz_lib.tex. Transistor gate pins are at the END of the gate lead
# (the circuitikz .gate anchor, measured); in TikZ prefer the node
# anchor (e.g. M1.gate) over the raw coordinate.
name: cmStd
macro: \cmStd
nargs: 0
arg_doc: []
exports:
  cStart:
  - 0
  - 0
description: Standard NMOS current mirror (M1 diode-connected, M2 output), grounds
  included, current arrows i_i/i_o. Path returns to entry.
entry:
- 0
- 0
exit:
- 0
- 0
height_grid: 2.1
width_grid: 2.0
pins:
- name: in
  grid_xy:
  - 0
  - 2.1
  direction: in
- name: out
  grid_xy:
  - 2.0
  - 2.1
  direction: out
nodes:
- mn1.gate
- mn1.drain
- mn2.gate
- mn2.drain
example: \draw (0,0) \cmStd;
