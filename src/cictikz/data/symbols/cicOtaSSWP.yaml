# cictikz symbol metadata. Coordinates are figure units (\grid = 1.6),
# relative to the macro entry point, y up, taken from the macro body in
# cictikz_lib.tex. Transistor gate pins are at the END of the gate lead
# (the circuitikz .gate anchor, measured); in TikZ prefer the node
# anchor (e.g. M1.gate) over the raw coordinate.
name: cicOtaSSWP
macro: \cicOtaSSWP
nargs: 2
arg_doc:
- +in label
- -in label
description: Single-ended OTA outline with caller-set input labels
entry:
- 0
- 0
exit:
- 0
- 0
height_grid: 0
width_grid: 0
pins:
- name: inp
  grid_xy:
  - 0
  - 0
  direction: in
- name: inn
  grid_xy:
  - 0
  - -0.8
  direction: in
- name: out
  grid_xy:
  - 2.6
  - -0.4
  direction: out
exports:
  cicOtaS_inp:
  - 0
  - 0
  cicOtaS_inn:
  - 0
  - -0.8
  cicOtaS_out:
  - 2.6
  - -0.4
example: \draw (0,0) \cicOtaSSWP{x}{x};
