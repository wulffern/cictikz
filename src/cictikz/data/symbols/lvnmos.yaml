# cictikz symbol metadata. Coordinates are figure units (\grid = 1.6),
# relative to the macro entry point, y up, taken from the macro body in
# cictikz_lib.tex. Transistor gate pins are at the END of the gate lead
# (the circuitikz .gate anchor, measured); in TikZ prefer the node
# anchor (e.g. M1.gate) over the raw coordinate.
name: lvnmos
macro: \lvnmos
nargs: 2
arg_doc:
- instance name (becomes circuitikz node, e.g. M1)
- gate port label, e.g. $v_i$ (empty {} suppresses the port)
description: NMOS transistor, vertical, drain up, gate on the left, with optional
  gate input port; gate pin is the end of the gate lead
entry:
- 0
- 0
exit:
- 0
- 1.6
height_grid: 1.6
width_grid: 1.1
pins:
- name: drain
  grid_xy:
  - 0
  - 1.6
  direction: inout
- name: gate
  grid_xy:
  - -0.98
  - 0.8
  direction: in
- name: source
  grid_xy:
  - 0
  - 0
  direction: inout
nodes:
- <inst>.drain
- <inst>.gate
- <inst>.source
- <inst>.bulk
exports:
  cicmos:
  - 0
  - 1.6
arg_ports:
  '2': gate
mirror: lvmnmos
xschem:
  sym: sky130_fd_pr/nfet_01v8.sym
  origin:
  - 0
  - 0.8
  pin_xy:
    drain:
    - 20
    - -30
    gate:
    - -20
    - 0
    source:
    - 20
    - 30
  flip: 0
  params: L=0.15 W=1 nf=1 m=1
  aliases:
    JNW_TR_SKY130A/JNWTR_NCHDL.sym:
      pin_xy:
        drain:
        - 40
        - -30
        gate:
        - 0
        - 0
        source:
        - 40
        - 30
    SUN_TR_SKY130NM/SUNTR_NCHDL.sym:
      pin_xy:
        drain:
        - 40
        - -30
        gate:
        - 0
        - 0
        source:
        - 40
        - 30
example: \draw (0,0) \vground \lvnmos{M1}{$v_i$};
