[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cictikz"
version = "0.1.0"
description = "AI-driven TikZ circuit schematics: symbol library, renderer, MCP server, xschem bridge"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Carsten Wulff", email = "carsten@wulff.no" }]
requires-python = ">=3.10"
dependencies = ["click", "pyyaml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
mcp = ["mcp[cli]"]

[project.urls]
Homepage = "https://github.com/wulffern/cictikz"

[project.scripts]
cictikz = "cictikz.cli:main"
cictikz-mcp = "cictikz.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cictikz = ["data/tex/*.tex", "data/symbols/*.yaml", "data/*.md"]
